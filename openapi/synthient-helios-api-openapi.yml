  /feeds/helio/dns/stream:
    get:
      operationId: streamHoneypotDNS
      summary: Stream Helios honeypot DNS queries in real time
      description: 'Real-time NDJSON stream of DNS queries directed at Helios honeypot tunnels. Each event records the queried domain, the destination port (53 for plain DNS, 853 for DoT, 5353 for mDNS), and the proxy/server/pool metadata of the inbound tunnel.


        **Required scope:** `HONEYPOT_DNS_STREAM`. **Schema:** see `HoneypotDNSStreamEntry` under Components.


        **Sample event:**

        ```

        {"timestamp":1714780800,"tunnel_id":42,"domain":"command-and-control.example","port":53,"meta":{"proxy_ip":"203.0.113.10","server":"hp-eu-1","pool_id":"prod","provider":"luminati"}}

        ```'
      tags:
      - Helios
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: NDJSON stream of honeypot_dns events. Each line is a complete JSON object. The connection stays open for up to 30 minutes.
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/HoneypotDNSStreamEntry'
        '401':
          description: Unauthorized — missing or invalid API key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden — API key lacks the required scope for this feed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too many concurrent streams from this client
          content:
