components:
  schemas:
    ExportListResponse:
      type: object
      properties:
        feeds:
          type: array
          items:
            $ref: '#/components/schemas/ExportListItem'
        next_cursor:
          type: string
        stream:
          type: string
      required:
      - stream
      - feeds
    ProjectedColumn:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
      required:
      - name
      - type
    HoneypotADBStreamEntry:
      type: object
      properties:
        command:
          type: string
          format: byte
          description: Shell command executed (base64-encoded bytes)
        hash:
          type: string
          description: Command hash
        sequential_id:
          type: integer
        session:
          type: string
          description: ADB session hash
    Schema:
      type: object
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ProjectedColumn'
      required:
      - fields
    HoneypotDNSStreamEntry:
      type: object
      properties:
        domain:
          type: string
          description: DNS name the attacker asked the honeypot to resolve
        meta:
          $ref: '#/components/schemas/HoneypotMeta'
        port:
          type: integer
          description: Destination port (53, 853, 5353)
        timestamp:
          type: integer
          format: int64
          description: Unix timestamp (seconds since epoch, UTC)
        tunnel_id:
          type: integer
          format: int64
    ExportListItem:
      type: object
      properties:
        checksum:
