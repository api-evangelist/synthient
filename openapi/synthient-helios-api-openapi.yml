  /feeds/helio/http/stream:
    get:
      operationId: streamHoneypotHTTP
      summary: Stream Helios honeypot HTTP captures in real time
      description: 'Real-time NDJSON stream of HTTP requests captured by Helios honeypot sensors. Each event includes method, URI, headers, version, and the raw request bytes plus the proxy/server/pool metadata of the inbound tunnel.


        **Required scope:** `HONEYPOT_HTTP_STREAM`. **Schema:** see `HoneypotHTTPStreamEntry` under Components.


        **Sample event:**

        ```

        {"timestamp":1714780800,"tunnel_id":42,"domain":"example.com","port":80,"meta":{"proxy_ip":"203.0.113.10","server":"hp-eu-1","pool_id":"prod","provider":"luminati"},"details":{"method":"GET","uri":"/admin","version":"HTTP/1.1","headers":{"User-Agent":"curl/7.81.0"}},"raw":"GET /admin HTTP/1.1\r\n…"}

        ```'
      tags:
      - Helios
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: NDJSON stream of honeypot_http events. Each line is a complete JSON object. The connection stays open for up to 30 minutes.
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/HoneypotHTTPStreamEntry'
        '401':
          description: Unauthorized — missing or invalid API key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden — API key lacks the required scope for this feed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too many concurrent streams from this client
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Service unavailable — streaming backend is down
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
